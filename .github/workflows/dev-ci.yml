name: Dev Branch CI

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev

jobs:
    lint-and-format:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run lint check
              run: npm run lint

            - name: Run format check
              run: npm run format
